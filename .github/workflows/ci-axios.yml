name: CI - Axios TypeScript Package

on:
  push:
    branches: [main]
  # Every PR, not just ones touching the package: this is the required check that shows
  # the generated client still builds, and a path-filtered required check never reports.
  pull_request:
    branches: [main]

permissions: {}

jobs:
  test-axios-package:
    name: Test Axios TypeScript Package
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "18"

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies
        working-directory: src/typescript/mitxonline-api-axios
        run: yarn install

      - name: Run pack dry-run
        working-directory: src/typescript/mitxonline-api-axios
        run: yarn pack --dry-run
